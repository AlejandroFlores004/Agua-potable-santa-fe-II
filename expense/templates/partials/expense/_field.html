<div class="form-control {{ class }}">
  <label class="label" for="{{ field.id_for_label }}">
    <span class="label-text">{{ field.label }}{% if field.field.required %} *{% endif %}</span>
  </label>
  {{ field }}
  {% if help %}<span class="text-xs opacity-60 mt-1">{{ help }}</span>{% endif %}
  {% if field.errors %}
  <span class="text-error text-xs mt-1">{{ field.errors|join:", " }}</span>
  {% endif %}
</div>
