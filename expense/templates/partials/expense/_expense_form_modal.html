<div class="modal modal-open modal-bottom sm:modal-middle" onclick="document.getElementById('modal-container').innerHTML=''">
  <div class="modal-box w-full max-w-none sm:max-w-lg relative" onclick="event.stopPropagation()">
    <button
      type="button"
      class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      onclick="document.getElementById('modal-container').innerHTML=''"
    >
      ✕
    </button>

    <h3 class="font-bold text-lg mb-4">
      {% if is_new %}Nuevo gasto{% else %}Editar gasto{% endif %}
    </h3>

    <form
      hx-post="{% if is_new %}{% url 'expense_create' %}{% else %}{% url 'expense_edit' expense.pk %}{% endif %}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
    >
      {% csrf_token %}
      {% include "partials/expense/_expense_form_fields.html" %}

      <div class="modal-action">
        <button
          type="button"
          class="btn"
          onclick="document.getElementById('modal-container').innerHTML=''"
        >
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
