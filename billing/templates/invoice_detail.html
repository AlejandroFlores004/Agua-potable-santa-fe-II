{% extends "base.html" %}

{% block title %}Factura {{ invoice.fee.name }}{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-4">
    <a href="{% url 'billing_home' %}" class="btn btn-ghost btn-sm gap-1 self-start -ml-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Facturas
    </a>

    <div id="invoice-summary"
         hx-get="{% url 'invoice_summary' invoice.pk %}"
         hx-trigger="invoiceSaved from:body, invoiceLinesChanged from:body"
         hx-target="this"
         hx-swap="innerHTML">
      {% include "partials/invoice/_invoice_summary.html" %}
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body gap-4">
      <h2 class="card-title">Líneas en esta factura</h2>

      <div class="flex flex-col sm:flex-row gap-2">
        <input
          type="text"
          name="q"
          value="{{ query }}"
          placeholder="Buscar por código, cliente o ubicación..."
          class="input input-bordered w-full max-w-sm"
          hx-get="{% url 'invoice_lines' invoice.pk %}"
          hx-trigger="keyup changed delay:400ms, search"
          hx-target="#invoice-lines-wrapper"
          hx-swap="innerHTML"
          hx-include="[name='status']"
        />
        <select
          name="status"
          class="select select-bordered w-full sm:w-48"
          hx-get="{% url 'invoice_lines' invoice.pk %}"
          hx-trigger="change"
          hx-target="#invoice-lines-wrapper"
          hx-swap="innerHTML"
          hx-include="[name='q']"
        >
          <option value="" {% if not status %}selected{% endif %}>Todos los estados</option>
          <option value="pending" {% if status == "pending" %}selected{% endif %}>Pendientes</option>
          <option value="paid" {% if status == "paid" %}selected{% endif %}>Pagadas</option>
        </select>
      </div>

      <div id="invoice-lines-wrapper"
           class="overflow-x-auto"
           hx-get="{% url 'invoice_lines' invoice.pk %}"
           hx-trigger="invoiceLinesChanged from:body"
           hx-target="this"
           hx-swap="innerHTML"
           hx-include="[name='q'], [name='status']">
        {% include "partials/invoice/_invoice_lines_table.html" %}
      </div>
    </div>
  </div>
</div>

<div id="modal-container"></div>
{% endblock %}
