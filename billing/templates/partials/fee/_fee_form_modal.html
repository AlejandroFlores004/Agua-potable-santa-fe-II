<div class="modal modal-open" onclick="document.getElementById('modal-container').innerHTML=''">
  <div class="modal-box max-w-md relative" onclick="event.stopPropagation()">
    <button
      type="button"
      class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      onclick="document.getElementById('modal-container').innerHTML=''"
    >
      ✕
    </button>

    <h3 class="font-bold text-lg mb-4">Nueva cuota</h3>

    <form
      hx-post="{% url 'fee_create' %}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
    >
      {% csrf_token %}

      {% if form.non_field_errors %}
      <div class="alert alert-error mb-4"><span>{{ form.non_field_errors|join:", " }}</span></div>
      {% endif %}

      <div class="flex flex-col gap-4">
        <div class="form-control">
          <label class="label" for="{{ form.name.id_for_label }}">
            <span class="label-text">Nombre *</span>
          </label>
          {{ form.name }}
          {% if form.name.errors %}
          <span class="text-error text-xs mt-1">{{ form.name.errors|join:", " }}</span>
          {% endif %}
        </div>

        <div class="form-control">
          <label class="label" for="{{ form.amount.id_for_label }}">
            <span class="label-text">Monto *</span>
          </label>
          {{ form.amount }}
          {% if form.amount.errors %}
          <span class="text-error text-xs mt-1">{{ form.amount.errors|join:", " }}</span>
          {% endif %}
        </div>
      </div>

      <div class="modal-action">
        <button
          type="button"
          class="btn"
          onclick="document.getElementById('modal-container').innerHTML=''"
        >
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
