{% extends "base.html" %}
{% load icons %}

{% block title %}Clientes{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Clientes</h1>
      <p class="text-sm text-gray-500">Administra los clientes y sus líneas de conexión.</p>
    </div>
    <button
      class="btn btn-primary gap-2"
      hx-get="{% url 'customer_create' %}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
    >
      {% icon "plus" %}
      Nuevo cliente
    </button>
  </div>

  <div class="card bg-base-100 shadow-sm sm:shadow-xl">
    <div class="card-body gap-4 p-4 sm:p-8">
      <input
        type="search"
        name="q"
        value="{{ query }}"
        placeholder="Buscar por nombre, DUI, correo o teléfono..."
        class="input input-bordered w-full sm:max-w-sm"
        hx-get="{% url 'customer_home' %}"
        hx-trigger="keyup changed delay:400ms, search"
        hx-target="#customer-table-wrapper"
        hx-swap="innerHTML"
      />

      <div id="customer-table-wrapper"
           hx-get="{% url 'customer_home' %}"
           hx-trigger="customerSaved from:body"
           hx-target="this"
           hx-swap="innerHTML"
           hx-include="[name='q'], #customer-table-wrapper [name='page']">
        {% include "partials/customer/_customer_table.html" %}
      </div>
    </div>
  </div>
</div>

<div id="modal-container"></div>
{% endblock %}
