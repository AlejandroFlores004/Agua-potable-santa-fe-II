{% load icons %}
<!-- ===== LOGOUT CONFIRMATION ===== -->
<dialog id="logout-modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box w-full max-w-none sm:max-w-sm">
    <div class="flex items-start gap-4">
      <div class="shrink-0 w-11 h-11 rounded-full bg-error/10 text-error flex items-center justify-center">
        {% icon "logout" class="w-5 h-5" %}
      </div>
      <div>
        <h3 class="font-bold text-lg">¿Cerrar sesión?</h3>
        <p class="text-sm text-gray-500 mt-1">
          Vas a salir de la cuenta <strong>{{ request.user.username }}</strong>. Tendrás que volver a iniciar sesión para continuar.
        </p>
      </div>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn">Cancelar</button>
      </form>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-error">Salir</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Cerrar">cerrar</button>
  </form>
</dialog>
