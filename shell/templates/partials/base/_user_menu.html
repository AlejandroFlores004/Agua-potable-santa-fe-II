<!-- ===== USER MENU (avatar + dropdown) ===== -->
<div class="dropdown dropdown-end">
  <div tabindex="0" role="button" aria-label="Menú de usuario"
       class="btn btn-ghost btn-sm h-10 gap-2 px-1 sm:px-2 rounded-full">
    <span class="w-8 h-8 rounded-full bg-primary/10 text-primary font-bold flex items-center justify-center uppercase">
      {{ request.user.username|first }}
    </span>
    <span class="hidden sm:inline text-sm font-medium">{{ request.user.username }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

  <div tabindex="0" class="dropdown-content z-50 mt-2 w-60 rounded-box bg-base-100 shadow-lg border border-base-300 p-2">
    <div class="px-3 py-2">
      <div class="text-xs text-gray-500">Sesión iniciada como</div>
      <div class="font-semibold truncate">{{ request.user.get_full_name|default:request.user.username }}</div>
    </div>
    <div class="border-t border-base-300 my-1"></div>
    <ul class="menu p-0 w-full">
      <li>
        <button type="button" class="text-error"
                onclick="document.activeElement.blur(); document.getElementById('logout-modal').showModal()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </button>
      </li>
    </ul>
  </div>
</div>
