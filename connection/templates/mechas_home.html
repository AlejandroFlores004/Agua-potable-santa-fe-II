{% extends "base.html" %}
{% load icons %}

{% block title %}Mechas{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Mechas</h1>
      <p class="text-sm text-gray-500">Administra las líneas de conexión de agua potable.</p>
    </div>
    <button
      class="btn btn-primary gap-2"
      hx-get="{% url 'line_create' %}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
    >
      {% icon "plus" %}
      Nueva mecha
    </button>
  </div>

  <div class="card bg-base-100 shadow-sm sm:shadow-xl">
    <div class="card-body gap-4 p-4 sm:p-8">
      <input
        type="search"
        name="q"
        value="{{ query }}"
        placeholder="Buscar por código, cliente, ubicación o descripción..."
        class="input input-bordered w-full sm:max-w-sm"
        hx-get="{% url 'mechas' %}"
        hx-trigger="keyup changed delay:400ms, search"
        hx-target="#line-table-wrapper"
        hx-swap="innerHTML"
      />

      <div id="line-table-wrapper"
           hx-get="{% url 'mechas' %}"
           hx-trigger="lineSaved from:body"
           hx-target="this"
           hx-swap="innerHTML"
           hx-include="[name='q'], #line-table-wrapper [name='page']">
        {% include "partials/line/_line_table.html" %}
      </div>
    </div>
  </div>
</div>

<div id="modal-container"></div>
{% endblock %}
